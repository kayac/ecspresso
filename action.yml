# The ecspresso GitHub Action has moved to kayac/ecspresso-action.
# This file forwards calls to it so that `uses: kayac/ecspresso@v3` keeps working.
# Keep the inputs in sync with kayac/ecspresso-action.
name: ecspresso (moved to kayac/ecspresso-action)
description: Deprecated. Use kayac/ecspresso-action instead.
inputs:
  version:
    description: "A version to install ecspresso"
    default: latest
    required: false
  version-file:
    description: "File containing the ecspresso version. Example: .ecspresso-version"
    required: false
  github-token:
    description: "The token used when calling GitHub API"
    required: false
    default: ${{ github.token }}
  args:
    description: "Arguments to pass to ecspresso"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - shell: bash
      run: echo "::warning::kayac/ecspresso action is deprecated. Use kayac/ecspresso-action@v3 instead."
    - uses: kayac/ecspresso-action@v3.0.0
      with:
        version: ${{ inputs.version }}
        version-file: ${{ inputs.version-file }}
        github-token: ${{ inputs.github-token }}
        args: ${{ inputs.args }}
