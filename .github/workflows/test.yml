name: Test
on:
  push:
    branches:
      - v3
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        go:
          - "1.27"
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ matrix.go }}

      - name: Build & Test
        run: |
          make clean
          make test
          make install
