name: test action
on:
  push:
    branches:
      - v3
    paths:
      - action.yml
      - .github/workflows/action.yml
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forwarder:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    name: forwarder (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: $/
        with:
          version: v2.0.4
      - run: ecspresso version 2>&1 | grep -F v2.0.4
      - uses: $/
        with:
          version-file: tests/.ecspresso-version
      - run: ecspresso version 2>&1 | grep -F v2.0.0
      - uses: $/
        with:
          version: v2.0.4
          args: version
